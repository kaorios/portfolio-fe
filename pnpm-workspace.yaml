overrides:
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5

# Reviewed and denied: neither build script is needed.
# core-js-pure's postinstall only prints a funding notice, and esbuild ships
# prebuilt platform binaries via its optional @esbuild/* packages.
allowBuilds:
  core-js-pure: false
  esbuild: false
